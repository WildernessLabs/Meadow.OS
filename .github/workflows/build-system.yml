name: Build System

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f DockerFiles/Build/Dockerfile -t meadow-os-build .

      - name: Run build.sh in Docker (with safe directory)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace meadow-os-build bash -c "git config --global --add safe.directory /workspace && ./build.sh"
