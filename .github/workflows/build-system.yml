name: Build OS and RT

on:
  repository_dispatch:
  push:
    branches: [ main, MergeManagedCode ]
  pull_request:
    branches: [ main, MergeManagedCode ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    #
    #   Full history is needed because the build number is the count of commits
    #   since version.txt last changed.  blob:none keeps the fetch small.
    #
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: blob:none

    #
    #   Only the submodules the OS build uses are fetched.  The submodule URLs
    #   are SSH, which needs a key the runner does not have; they are all
    #   public so rewrite them to anonymous HTTPS.
    #
    - name: Checkout required submodules
      if: false    # temporarily disabled
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --depth 1 mbedtls mono/external/corefx

    #
    #   The Mono runtime is built from the WildernessLabs/runtime commit
    #   recorded in MONO_RUNTIME_COMMIT.  Fetch only that commit, into the
    #   workspace so that the build container can see it; build-mono.sh
    #   checks that the checkout matches the pin.
    #
    - name: Fetch the pinned Mono runtime
      run: |
        repository=$(sed -n 's/^repository=//p' MONO_RUNTIME_COMMIT)
        commit=$(sed -n 's/^commit=//p' MONO_RUNTIME_COMMIT)
        git init -q runtime-src
        git -C runtime-src fetch -q --depth 1 "$repository" "$commit"
        git -C runtime-src checkout -q FETCH_HEAD
        git -C runtime-src log -1 --format='Runtime: %H %s'

    - name: Build Docker image for the OS build.
      run: docker build -t nuttx-build -f ./DockerFiles/Build/Dockerfile .

    - name: Build the OS and RT
      run: docker run --rm -v $PWD:/project -w /project -e MEADOW_RUNTIME_DIR=/project/runtime-src --user "$(id -u):$(id -g)" nuttx-build ./build.sh --force --clean

    #
    #   Artifacts match those published by the Azure pipeline (azure-pipelines.yml).
    #
    - name: Upload the OS
      uses: actions/upload-artifact@v4
      with:
        name: Meadow.OS
        if-no-files-found: error
        path: |
          nuttx/Meadow.OS.bin
          nuttx/Meadow.OS.Update.bin
          nuttx/Meadow.OS.Runtime.bin
          nuttx/build-info.json

    - name: Upload the debug symbols
      uses: actions/upload-artifact@v4
      with:
        name: Meadow.OS Debug Symbols
        if-no-files-found: error
        path: |
          nuttx/nuttx.elf
          nuttx/nuttx_user.elf
          nuttx/System.map
          nuttx/User.map
          bootloader/Debug/Meadow.BL.elf

  #
  #   The managed assemblies (meadow_assemblies) that Meadow apps are trimmed
  #   against and deployed with, built from the same pinned runtime as the OS.
  #
  assemblies:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Fetch the pinned Mono runtime
      run: |
        repository=$(sed -n 's/^repository=//p' MONO_RUNTIME_COMMIT)
        commit=$(sed -n 's/^commit=//p' MONO_RUNTIME_COMMIT)
        git init -q runtime-src
        git -C runtime-src fetch -q --depth 1 "$repository" "$commit"
        git -C runtime-src checkout -q FETCH_HEAD
        git -C runtime-src log -1 --format='Runtime: %H %s'

    - name: Build the managed assemblies
      run: MEADOW_RUNTIME_DIR=$PWD/runtime-src ./build-managed-assemblies.sh --verbose

    - name: Upload the managed assemblies
      uses: actions/upload-artifact@v4
      with:
        name: meadow_assemblies
        if-no-files-found: error
        path: |
          meadow_assemblies/*.dll
          meadow_assemblies/ILLink.Descriptors.xml
          meadow_assemblies/build-info.txt
