name: Build OS and RT

on:
  repository_dispatch:
  push:
    branches: [ main, MergeManagedCode ]
  pull_request:
    branches: [ main, MergeManagedCode ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    #
    #   Full history is needed because the build number is the count of commits
    #   since version.txt last changed.  blob:none keeps the fetch small.
    #
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: blob:none

    #
    #   Only the submodules the OS build uses are fetched.  The submodule URLs
    #   are SSH, which needs a key the runner does not have; they are all
    #   public so rewrite them to anonymous HTTPS.
    #
    - name: Checkout required submodules
      if: false    # temporarily disabled
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --depth 1 mbedtls mono/external/corefx

    - name: Build Docker image for the OS build.
      run: docker build -t nuttx-build -f ./DockerFiles/Build/Dockerfile .

    - name: Build the OS and RT
      run: docker run --rm -v $PWD:/project -w /project --user "$(id -u):$(id -g)" nuttx-build ./build.sh --force --clean

    #
    #   Artifacts match those published by the Azure pipeline (azure-pipelines.yml).
    #
    - name: Upload the OS
      uses: actions/upload-artifact@v4
      with:
        name: Meadow.OS
        if-no-files-found: error
        path: |
          nuttx/Meadow.OS.bin
          nuttx/Meadow.OS.Update.bin
          nuttx/Meadow.OS.Runtime.bin
          nuttx/build-info.json

    - name: Upload the debug symbols
      uses: actions/upload-artifact@v4
      with:
        name: Meadow.OS Debug Symbols
        if-no-files-found: error
        path: |
          nuttx/nuttx.elf
          nuttx/nuttx_user.elf
          nuttx/System.map
          nuttx/User.map
          bootloader/Debug/Meadow.BL.elf

  bcl:
    if: false    # temporarily disabled
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    #
    #   The BCL needs the mbedtls headers and the Mono external submodules.
    #   llvm-project is skipped as it is large and not used by the BCL.
    #   Recursive because some (e.g. api-doc-tools) have nested submodules.
    #
    - name: Checkout required submodules
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --recursive --depth 1 mbedtls \
          $(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}' | grep '^mono/external/' | grep -v llvm-project)

    - name: Build Docker image for the BCL build.
      run: docker build -t nuttx-build -f ./DockerFiles/Build/Dockerfile .

    - name: Build the BCL
      run: docker run --rm -v $PWD:/project -w /project --user "$(id -u):$(id -g)" nuttx-build ./build-mono-bcl.sh --verbose

    #
    #   Match the Azure pipeline (azure-pipelines-bcl.yml), which flattens the
    #   BCL into a meadow_assemblies folder.
    #
    - name: Stage the BCL
      run: |
        mkdir -p artifacts/meadow_assemblies
        find monobcl/libs/bcl -type f -exec cp {} artifacts/meadow_assemblies/ \;

    - name: Upload the BCL
      uses: actions/upload-artifact@v4
      with:
        name: BCL
        if-no-files-found: error
        path: artifacts
