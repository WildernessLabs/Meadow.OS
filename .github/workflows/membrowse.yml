name: MemBrowse Memory Report

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

#
#   The PR comment is posted by membrowse-comment.yml, which runs after this
#   workflow completes (workflow_run), so this workflow needs no write access.
#
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load target matrix
        id: set-matrix
        run: echo "matrix=$(jq -c '.' .github/membrowse-targets.json)" >> $GITHUB_OUTPUT

  analyze:
    needs: load-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}

    steps:
      #
      #   Full history is needed because the build number is the count of
      #   commits since version.txt last changed (same as build-system.yml).
      #   It also provides the parent commit MemBrowse diffs against.
      #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      #
      #   The OS build includes the Mono runtime, built from the
      #   WildernessLabs/runtime commit recorded in MONO_RUNTIME_COMMIT (same
      #   as build-system.yml).  The build command passes
      #   MEADOW_RUNTIME_DIR=/project/runtime-src to the build container.
      #
      - name: Fetch the pinned Mono runtime
        run: |
          repository=$(sed -n 's/^repository=//p' MONO_RUNTIME_COMMIT)
          commit=$(sed -n 's/^commit=//p' MONO_RUNTIME_COMMIT)
          git init -q runtime-src
          git -C runtime-src fetch -q --depth 1 "$repository" "$commit"
          git -C runtime-src checkout -q FETCH_HEAD
          git -C runtime-src log -1 --format='Runtime: %H %s'

      - name: Install packages
        run: ${{ matrix.setup_cmd }}

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Run MemBrowse analysis
        uses: membrowse/membrowse-action@v1
        with:
          target_name: ${{ matrix.target_name }}
          elf: ${{ matrix.elf }}
          ld: ${{ matrix.ld }}
          map_file: ${{ matrix.map_file }}
          linker_vars: ${{ matrix.linker_vars }}
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
          verbose: INFO
          # Uncomment to allow CI to pass even when memory budgets are exceeded
          # dont_fail_on_alerts: true
