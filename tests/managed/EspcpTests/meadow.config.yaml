#
#   Configuration shipped when the app is deployed by hand: the JIT, WiFi with DHCP.  The test
#   runner uses this file as the base for each mode (manifest key `config`) and only replaces its
#   MonoControl section.
#
Device:
    Name: MeadowTests
Network:
    Interfaces:
        - Name: WiFi
          UseDHCP: true
    DefaultInterface: WiFi
    CountryCode: GB
    DnsServers:
        - 1.1.1.1
        - 8.8.8.8
CoProcessor:
    AutomaticallyStartNetwork: true
    AutomaticallyReconnect: true
    MaximumRetryCount: 7
    LogDestination: UART
    LogComponents: WiFi;Messages;System
