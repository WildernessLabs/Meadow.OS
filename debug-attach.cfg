#
#   OpenOCD configuration for attaching to a running Meadow without resetting it.
#
#   The same as debug.cfg but without "reset init", so the board keeps running when OpenOCD
#   starts.  Use debug.cfg to start a debug session from reset.
#
source [find interface/stlink.cfg]
source [find target/stm32f7x.cfg]

# reset_config can be commented out if using official ST-Link devices.
# It's necessary for ST-Link clones when not using the RST pin connection.
reset_config none separate

gdb port 4242
debug_level 1
tcl port 6666

stm32f7x.cpu configure -rtos nuttx

init
